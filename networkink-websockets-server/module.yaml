product:
  type: kmp/lib
  platforms: [ jvm, android, js, wasmJs, linuxX64, linuxArm64, macosArm64, tvosArm64, iosArm64, watchosArm64, mingwX64 ]

apply:
  - //publishing.module-template.yaml

dependencies:
  - //networkink-core: exported
  - //networkink-websockets: exported
  - $ktor.server.websockets

settings:
  ktor: enabled
  publishing:
    artifactId: networkink-websockets-server
product:
  type: kmp/lib
  platforms: [ jvm, android, js, wasmJs, linuxX64, linuxArm64, macosArm64, tvosArm64, iosArm64, watchosArm64, mingwX64 ]

apply:
  - //publishing.module-template.yaml

dependencies:
  - //networkink-core: exported
  - $ktor.websockets: exported

test-dependencies:
  - //networkink-test
  - //networkink-websockets-client
  - //networkink-websockets-server
  - $ktor.client.cio
  - $ktor.server.cio
  - $libs.cryptographyKotlin.provider.optimal

settings:
  ktor: enabled
  publishing:
    artifactId: networkink-websockets
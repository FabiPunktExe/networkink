product:
  type: kmp/lib
  platforms: [ jvm, android, js, wasmJs, linuxX64, linuxArm64, macosArm64, tvosArm64, iosArm64, watchosArm64, mingwX64 ]

repositories:
  - url: https://repo.diruptio.de/repository/maven-public

dependencies:
  - //networkink-core
  - //networkink-protocol
  - $kotlin.test
  - $ktor.network
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.coroutines.test
  - $libs.buffer

settings:
  ktor: enabled